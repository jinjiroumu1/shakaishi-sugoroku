<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社労士日光街道すごろく</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-950:#101d33; --indigo-900:#16243f; --indigo-800:#1e3358; --indigo-700:#28457a;
    --indigo-500:#3d5f9e; --indigo-200:#c3d0e8;
    --paper:#f1ead8; --paper-line:#d9cca4;
    --vermillion:#c1442c; --vermillion-dark:#932f1c;
    --gold:#c79a3e; --gold-soft:#e9d8ab;
    --forward:#3d7a52; --forward-soft:#cfe6d6;
    --back:#a0552f; --back-soft:#ecd7c4;
    --ink:#20242c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 8%, rgba(193,68,44,0.06), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(61,95,158,0.08), transparent 40%),
      var(--paper);
    color:var(--ink); font-family:'Zen Kaku Gothic New', sans-serif; min-height:100vh;
  }
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 64px;}
  .hero{
    position:relative; background:linear-gradient(155deg, var(--indigo-950), var(--indigo-800) 70%);
    border-radius:18px; padding:28px 24px 24px; color:#f4ecd8; overflow:hidden;
    box-shadow:0 10px 30px -12px rgba(16,29,51,0.5);
    display:flex; gap:24px; align-items:center; justify-content:space-between; flex-wrap:wrap;
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background-image:radial-gradient(circle, rgba(233,216,171,0.10) 1.5px, transparent 1.5px);
    background-size:16px 16px; opacity:0.5;
  }
  .hero-main{position:relative; flex:1; min-width:240px;}
  .hero-eyebrow{font-size:0.72rem; letter-spacing:0.16em; color:var(--gold-soft); font-weight:700; position:relative;}
  .hero h1{font-family:'Shippori Mincho', serif; font-weight:800; font-size:1.8rem; margin:6px 0 4px; position:relative; line-height:1.35;}
  .hero h1 span{color:var(--vermillion);}
  .hero p.sub{margin:0; font-size:0.85rem; color:var(--indigo-200); position:relative;}
  .hero .period{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; position:relative;}
  .chip{background:rgba(244,236,216,0.08); border:1px solid rgba(244,236,216,0.25); border-radius:999px; padding:6px 14px; font-size:0.76rem; color:#f4ecd8;}
  .chip b{color:var(--gold-soft);}
  .hero-player{
    position:relative; background:rgba(244,236,216,0.08); border:1px solid rgba(244,236,216,0.25);
    border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:10px; min-width:220px;
  }
  .status-block{display:flex; flex-direction:column; gap:2px;}
  .status-label{font-size:0.66rem; letter-spacing:0.08em; color:var(--gold-soft); font-weight:700;}
  .status-value{font-size:1.05rem; font-weight:900; color:#f4ecd8; font-family:'Shippori Mincho',serif;}
  .status-value.small{font-size:0.88rem;}
  .avatar{width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; color:#fff;font-weight:800;font-size:0.9rem; flex-shrink:0; box-shadow:inset 0 0 0 2px rgba(255,255,255,0.35);}
  .who{display:flex; gap:10px; align-items:center;}
  .hero-player .btn-ghost{border-color:rgba(244,236,216,0.4); color:#f4ecd8;}
  .btn{border:none; cursor:pointer; font-family:inherit; font-weight:700; border-radius:10px; padding:11px 18px; font-size:0.9rem; transition:transform .12s ease, opacity .12s ease;}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:0.42; cursor:not-allowed;}
  .btn-main{background:linear-gradient(180deg, var(--vermillion), var(--vermillion-dark)); color:#fff8ee; box-shadow:0 6px 14px -6px rgba(147,47,28,0.6); font-size:1rem; padding:13px 26px;}
  .btn-bonus{background:var(--indigo-800); color:#f1ead8;}
  .btn-ghost{background:transparent; border:1px solid var(--paper-line); color:var(--indigo-800);}
  .btn-small{padding:7px 12px; font-size:0.78rem; border-radius:8px;}
  section.panel{margin-top:22px; background:#fffdf7; border:1px solid var(--paper-line); border-radius:14px; padding:20px;}
  h2.panel-title{font-family:'Shippori Mincho', serif; font-size:1.05rem; margin:0 0 4px; color:var(--indigo-900); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  h2.panel-title .tag{font-size:0.65rem; background:var(--gold-soft); color:#6b5320; padding:2px 8px; border-radius:999px; font-family:'Zen Kaku Gothic New'; font-weight:700;}
  p.panel-desc{font-size:0.8rem; color:#7c7360; margin:0 0 14px;}
  .dice-zone{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .dice-3col{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:720px){ .dice-3col{grid-template-columns:1fr;} }
  .dice-col{
    background:var(--paper); border:1px solid var(--paper-line); border-radius:12px;
    padding:16px 14px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
  }
  .dice-col-label{font-size:0.85rem; font-weight:800; color:var(--indigo-900);}
  .dice-col-desc{font-size:0.72rem; color:#7c7360;}
  .dice-face{width:64px;height:64px;border-radius:14px; background:#fff8ee; border:2px solid var(--indigo-800); display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-weight:900; color:var(--indigo-900); box-shadow:3px 3px 0 var(--gold);}
  .dice-face.rolling{animation:shake 0.5s ease;}
  @keyframes shake{0%,100%{transform:rotate(0);} 25%{transform:rotate(-14deg) scale(1.05);} 50%{transform:rotate(10deg) scale(0.96);} 75%{transform:rotate(-8deg) scale(1.03);}}
  .dice-msg{font-size:0.85rem; color:#5c5644;}
  .bonus-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px;}
  .bonus-item{background:var(--paper); border:1px solid var(--paper-line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:8px;}
  .bonus-item .label{font-size:0.82rem; font-weight:700; color:var(--indigo-900); line-height:1.4;}
  .bonus-item .amount{font-size:0.72rem; color:var(--vermillion-dark); font-weight:700;}

  /* route strip */
  .route-scroll{overflow-x:auto; padding:18px 4px 14px;}
  .map-wrap{width:100%; max-width:640px; margin:0 auto;}
  .map-svg{transition: none;}
  .my-token-pulse{animation: mapPulse 1.6s ease-out infinite;}
  @keyframes mapPulse{
    0%{ r:26; opacity:0.9; }
    100%{ r:52; opacity:0; }
  }
  .my-token-marker{ transition: transform 0.9s cubic-bezier(.4,0,.2,1); }
  .map-toolbar{display:flex; justify-content:center; margin-bottom:10px; gap:8px; flex-wrap:wrap;}

  /* 「サイコロを振る」ボタンごと、画面右側に常時固定表示するパネル */
  .dice-float{
    position:fixed; right:16px; top:50%; transform:translateY(-50%);
    z-index:60; display:flex; flex-direction:column; align-items:center; gap:8px;
    background:#fff8ee; border:2px solid var(--indigo-800); border-radius:16px;
    padding:12px 10px; box-shadow:0 10px 26px -8px rgba(16,29,51,0.5);
  }
  .dice-float.hidden{display:none;}
  .dice-face-float{
    width:52px; height:52px; border-radius:12px;
    background:var(--paper); border:2px solid var(--indigo-800);
    display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; font-weight:900; color:var(--indigo-900);
  }
  .dice-face-float.rolling{animation: shake 0.5s ease infinite;}
  .dice-float-btn{
    writing-mode:vertical-rl; text-orientation:mixed;
    background:linear-gradient(180deg, var(--vermillion), var(--vermillion-dark)); color:#fff8ee;
    border:none; border-radius:10px; padding:10px 8px; font-weight:700; font-size:0.8rem;
    cursor:pointer; letter-spacing:0.05em;
  }
  .dice-float-btn:disabled{opacity:0.4; cursor:not-allowed;}
  @media (max-width:640px){
    .dice-float{ right:8px; top:auto; bottom:16px; flex-direction:row; padding:8px; }
    .dice-float-btn{ writing-mode:horizontal-tb; padding:10px 14px; font-size:0.78rem; }
    .dice-face-float{ width:44px; height:44px; font-size:1.2rem; }
  }
  .map-svg{width:100%; height:auto; display:block; border-radius:16px; box-shadow:0 6px 20px -8px rgba(16,29,51,0.35); touch-action:none; cursor:grab;}
  .map-svg:active{cursor:grabbing;}
  .route{
    position:relative; display:flex; align-items:flex-end; min-width:max-content;
    padding-top:14px;
    background-image: repeating-linear-gradient(90deg, var(--indigo-500) 0 10px, transparent 10px 18px);
    background-position: 0 22px; background-repeat: repeat-x; background-size: 100% 4px;
  }
  .wp{position:relative; display:flex; flex-direction:column; align-items:center; padding:0 2px;}
  .wp.plain{width:9px;}
  .wp.station, .wp.sidequest, .wp.special{width:74px;}
  .wp-tokens{display:flex; flex-wrap:wrap; gap:2px; justify-content:center; min-height:20px; margin-bottom:2px; max-width:70px;}
  .wp-token{width:16px;height:16px;border-radius:50%; color:#fff; font-size:0.45rem; font-weight:800; display:flex;align-items:center;justify-content:center; border:1.5px solid #fff8ee; box-shadow:0 1px 2px rgba(0,0,0,0.3);}
  .wp-dot{width:7px;height:7px;border-radius:50%; background:var(--indigo-500); margin-top:-15px;}
  .wp-badge{
    width:46px; height:46px; border-radius:50%; margin-top:-38px; margin-bottom:6px;
    display:flex; align-items:center; justify-content:center; font-size:1.35rem;
    background:#fff8ee; border:3px solid var(--indigo-700);
    box-shadow:0 3px 0 rgba(16,29,51,0.15), 0 4px 10px -4px rgba(16,29,51,0.4);
  }
  .wp.station.goal .wp-badge{border-color:var(--vermillion); background:var(--gold-soft);}
  .wp.sidequest .wp-badge{background:var(--gold-soft); border-color:var(--gold);}
  .wp.special .wp-badge{width:34px; height:34px; margin-top:-32px; font-size:1rem; border-width:3px; border-color:var(--forward); background:var(--forward-soft);}
  .wp.special.back .wp-badge{border-color:var(--back); background:var(--back-soft);}
  .wp-label{
    font-size:0.62rem; text-align:center; margin-top:2px; color:var(--indigo-900); line-height:1.3; font-weight:700; max-width:74px;
    background:#fffdf7; border:1px solid var(--paper-line); border-radius:6px; padding:2px 4px;
  }
  .wp.sidequest .wp-label{color:#8a6a1a; border-color:var(--gold-soft);}
  .wp.special .wp-label{color:var(--forward); font-size:0.58rem;}
  .wp.special.back .wp-label{color:var(--back);}
  .start-end-label{font-size:0.72rem; color:#8a7c5c; font-weight:700; padding:0 8px 2px; display:flex; align-items:center; gap:6px;}

  table.rank{width:100%; border-collapse:collapse; font-size:0.85rem;}
  table.rank th{text-align:left; font-size:0.68rem; color:#8a7c5c; letter-spacing:0.05em; padding:6px 8px; border-bottom:1px solid var(--paper-line);}
  table.rank td{padding:9px 8px; border-bottom:1px solid #efe6cd;}
  table.rank tr.me{background:rgba(193,68,44,0.06);}
  .medal{font-size:0.9rem;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(16,20,30,0.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; opacity:1; transition: opacity 0.28s ease;}
  .modal-backdrop.fade-out{opacity:0;}
  .modal-card{background:#fffaf0; border-radius:16px; max-width:420px; width:100%; padding:28px 24px 24px; position:relative; text-align:center; box-shadow:0 24px 60px -20px rgba(0,0,0,0.5);}
  .stamp{width:88px; height:88px; border-radius:50%; border:5px solid var(--vermillion); color:var(--vermillion); display:flex; align-items:center; justify-content:center; font-family:'Shippori Mincho', serif; font-weight:800; font-size:0.9rem; margin:0 auto 14px; transform:rotate(-8deg) scale(0); animation:stampIn 0.45s cubic-bezier(.2,1.4,.4,1) forwards; animation-delay:0.15s;}
  .stamp.side{border-color:var(--gold); color:#8a6a1a;}
  .stamp.forward{border-color:var(--forward); color:var(--forward);}
  .stamp.back{border-color:var(--back); color:var(--back);}
  @keyframes stampIn{0%{transform:rotate(-8deg) scale(2.4); opacity:0;} 60%{opacity:1;} 100%{transform:rotate(-8deg) scale(1); opacity:1;}}
  .modal-card h3{font-family:'Shippori Mincho', serif; margin:0 0 10px; color:var(--indigo-900);}
  .modal-card p.quote{font-size:0.88rem; color:#4a4433; line-height:1.7; margin:0 0 14px;}
  .branch-illustration{font-size:3.2rem; text-align:center; margin:-6px 0 10px;}
  .modal-card p.note{font-size:0.68rem; color:#a99a72; margin:0 0 18px;}

  /* ---------- 3D dice ---------- */
  .dice-modal-card{max-width:520px;}
  .dice-3d-row{display:flex; flex-wrap:wrap; gap:16px; justify-content:center; padding:24px 0 10px;}
  .die-stage{perspective:600px;}
  .die-cube{
    position:relative; width:64px; height:64px; transform-style:preserve-3d;
    transition: transform 1s cubic-bezier(.34,1.56,.64,1);
  }
  .die-face{
    position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    padding:9px; box-sizing:border-box; background:#fff8ee; border:2px solid var(--indigo-800); border-radius:10px;
    backface-visibility:hidden;
  }
  .die-face .pip{width:9px; height:9px; border-radius:50%; background:var(--vermillion-dark); justify-self:center; align-self:center;}
  .die-face.front{ transform: translateZ(32px); }
  .die-face.back{ transform: rotateY(180deg) translateZ(32px); }
  .die-face.right{ transform: rotateY(90deg) translateZ(32px); }
  .die-face.left{ transform: rotateY(-90deg) translateZ(32px); }
  .die-face.top{ transform: rotateX(90deg) translateZ(32px); }
  .die-face.bottom{ transform: rotateX(-90deg) translateZ(32px); }
  .dice-result{font-size:1rem; font-weight:800; color:var(--indigo-900); text-align:center; min-height:1.6em; margin-bottom:10px; font-family:'Shippori Mincho', serif;}

  /* ---------- choice modal (bonus options) ---------- */
  .choice-modal-card{max-width:460px; text-align:left;}
  .choice-modal-card h3{text-align:center;}
  .choice-modal-card > p.note{text-align:center;}
  .choice-list{display:flex; flex-direction:column; gap:8px;}
  .choice-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--paper); border:1px solid var(--paper-line); border-radius:10px;
    padding:12px 14px; cursor:pointer; font-family:inherit; text-align:left;
  }
  .choice-item:hover{ background:var(--gold-soft); }
  .choice-label{font-size:0.85rem; font-weight:700; color:var(--indigo-900);}
  .choice-amount{font-size:0.72rem; color:var(--vermillion-dark); font-weight:700; white-space:nowrap;}

  /* ---------- episode textarea ---------- */
  .episode-textarea{
    width:100%; border:1px solid var(--paper-line); border-radius:10px; padding:10px 12px;
    font-family:inherit; font-size:0.9rem; background:var(--paper); resize:vertical; box-sizing:border-box;
  }

  /* ---------- bulletin board ---------- */
  .board-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-height:420px; overflow-y:auto;}
  .board-item{background:var(--paper); border:1px solid var(--paper-line); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column;}
  .board-item-head{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .board-type-tag{font-size:0.64rem; font-weight:700; padding:2px 7px; border-radius:999px; color:#fff8ee;}
  .board-type-tag.client{background:var(--indigo-700);}
  .board-type-tag.hokkori{background:var(--gold); color:#5c4416;}
  .board-nick{font-size:0.72rem; font-weight:800; color:var(--indigo-900); margin-top:8px; text-align:right;}
  .board-date{font-size:0.62rem; color:#a99a72; margin-left:auto;}
  .board-text{font-size:0.8rem; color:#4a4433; line-height:1.6; flex:1;}
  .board-empty{grid-column:1/-1; font-size:0.8rem; color:#a99a72; text-align:center; padding:10px;}
  @media (max-width:720px){ .board-grid{grid-template-columns:1fr;} }

  .join-screen{max-width:420px; margin:60px auto; background:#fffdf7; border:1px solid var(--paper-line); border-radius:16px; padding:30px 26px; text-align:center;}
  .join-screen h1{font-family:'Shippori Mincho', serif; color:var(--indigo-900); font-size:1.4rem; margin-bottom:6px;}
  .join-screen p{font-size:0.82rem; color:#7c7360; margin-bottom:18px; line-height:1.6;}
  .join-screen input{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--paper-line); font-size:1rem; font-family:inherit; margin-bottom:12px; background:var(--paper);}
  .join-screen .err{color:var(--vermillion-dark); font-size:0.78rem; margin:-6px 0 12px; min-height:1em;}
  .warn-box{margin-top:16px; background:#fbf2e2; border:1px solid var(--gold-soft); border-radius:10px; padding:10px 12px; font-size:0.72rem; color:#7a5f22; text-align:left; line-height:1.6;}
  .footer-note{margin-top:26px; font-size:0.7rem; color:#a99a72; text-align:center; line-height:1.7;}
  .history-log{max-height:180px; overflow-y:auto; font-size:0.78rem; color:#5c5644;}
  .history-log div{padding:5px 0; border-bottom:1px dashed #e6dcbf;}
  .switch-user{font-size:0.7rem; color:#a99a72; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ 基本設定 ============ */
const CAMPAIGN_START = '2026-09-04';
const CAMPAIGN_END   = '2027-03-31';

const STATION_INFO = [
  {name:'千住宿',   icon:'🌉', trivia:'日光街道最初の宿場。松尾芭蕉「おくのほそ道」の旅もここから始まったとか。'},
  {name:'草加宿',   icon:'🍘', trivia:'松並木「草加松原」で知られる宿場町。せんべいの街としても有名。'},
  {name:'越ヶ谷宿', icon:'🎏', trivia:'日光街道有数の規模を誇った宿場町。'},
  {name:'粕壁宿',   icon:'🌾', trivia:'現在の春日部。旅人でにぎわった宿場。'},
  {name:'杉戸宿',   icon:'🌳', trivia:'日光御成道にもほど近い、落ち着いた宿場。'},
  {name:'幸手宿',   icon:'🌸', trivia:'桜の名所としても知られる宿場町。'},
  {name:'栗橋宿',   icon:'⛴️', trivia:'利根川の渡し場を控えた交通の要衝。'},
  {name:'中田宿',   icon:'🌊', trivia:'利根川を渡った先、下総国最初の宿場。'},
  {name:'古河宿',   icon:'🏯', trivia:'城下町としても栄えた宿場町。'},
  {name:'野木宿',   icon:'⛩️', trivia:'国境を越え、下野国に入って最初の宿場。'},
  {name:'間々田宿', icon:'🍡', trivia:'こぶりながらも旅人の休息地として賑わった。'},
  {name:'小山宿',   icon:'🏭', trivia:'日光街道有数の規模を持つ宿場町。'},
  {name:'新田宿',   icon:'🌳', trivia:'喜沢追分にほど近い、静かな宿場。'},
  {name:'小金井宿', icon:'🪨', trivia:'一里塚が今も残る宿場町。'},
  {name:'石橋宿',   icon:'🕊️', trivia:'静かな佇まいを残す宿場。'},
  {name:'雀宮宿',   icon:'🐦', trivia:'宇都宮に近づく最後の小宿場。'},
  {name:'宇都宮宿', icon:'🥟', trivia:'奥州街道との分岐点。餃子の街としても有名。'},
  {name:'徳次郎宿', icon:'⛰️', trivia:'日光連山を望む宿場。'},
  {name:'大沢宿',   icon:'🌲', trivia:'日光まであと少し、旅の終盤の宿場町。'},
  {name:'今市宿',   icon:'🛤️', trivia:'会津西街道との分岐点。日光街道随一の賑わいを見せた。'},
  {name:'鉢石宿',   icon:'⛩️', trivia:'いよいよ日光東照宮のお膝元、旅の終点。'},
];
// 宿場の手前に置くマス数（毎日1回・約3か月でゴールするペースを想定して調整）
const GAP_FILLERS = [20,20,18,22,14,10,20,4,10,12,10,12,8,10,10,14,14,22,18,20,14];

// 寄り道マス（本筋から分岐する場所。あとで自由に追加できます）

/* ============ 盤面の自動生成 ============ */
let WAYPOINTS = []; // index 1..GOAL_POS
let BRANCH_POINTS = {}; // pos -> 寄り道の分岐情報
(function buildBoard(){
  let idx = 0;
  for(let s=0; s<STATION_INFO.length; s++){
    const fillers = GAP_FILLERS[s];
    for(let f=0; f<fillers; f++){
      idx++;
      WAYPOINTS.push({pos:idx, type:'plain', gapIndex:s, offset:f});
    }
    idx++;
    WAYPOINTS.push({pos:idx, type:'station', name:STATION_INFO[s].name, icon:STATION_INFO[s].icon, trivia:STATION_INFO[s].trivia, isGoal:(s===STATION_INFO.length-1), stationOrder:s});
  }
  SIDEQUEST_DEFS.forEach(sq=>{
    const target = WAYPOINTS.find(w=>w.type==='plain' && w.gapIndex===sq.afterGapIndex && w.offset===sq.offsetInGap);
    if(target){
      // 本筋のマスの型は変えず（plainのまま）、分岐点として別途登録するだけにする。
      BRANCH_POINTS[target.pos] = sq;
    }
  });
  SPECIAL_DEFS.forEach(sp=>{
    const target = WAYPOINTS.find(w=>w.type==='plain' && w.gapIndex===sp.afterGapIndex && w.offset===sp.offsetInGap);
    if(target){
      target.type = 'special';
      target.kind = sp.kind; // 'forward' | 'back1' | 'back2'
    }
  });
})();
const GOAL_POS = WAYPOINTS[WAYPOINTS.length-1].pos;
function wpAt(pos){ return WAYPOINTS.find(w=>w.pos===pos); }
function stationPos(order){
  if(order < 0) return 0;
  const w = WAYPOINTS.find(w=>w.type==='station' && w.stationOrder===order);
  return w ? w.pos : 0;
}
function stationLabel(pos){ if(pos<=0) return '日本橋'; const w=wpAt(pos); return (w && w.name) ? w.name : ('マス'+pos); }
function specialTarget(w){
  if(w.kind==='forward') return stationPos(w.gapIndex);
  if(w.kind==='back1') return stationPos(w.gapIndex-1);
  if(w.kind==='back2') return stationPos(w.gapIndex-2);
  return w.pos;
}

const AVATAR_COLORS = ['#c1442c','#28457a','#3d7a52','#c79a3e','#7a4fa0','#1e8a8a','#a0552f','#5a6e2b'];
function colorFor(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))%AVATAR_COLORS.length; return AVATAR_COLORS[h]; }

// ジグザグ格子状（New Yearすごろく風）に配置。左上スタート→行ごとに折り返しながらゴールへ。
const MAP_COLS = 5;
const N_NODES = MAP_NODES.length;
const MAP_ROWS = Math.ceil(N_NODES / MAP_COLS);
const MAP_CELL_W = 168, MAP_CELL_H = 190;
const MAP_PAD_X = 76, MAP_PAD_Y = 90;
const MAP_TOP_EXTRA = 170; // 寄り道バブルが真上に伸びても切れないための、上だけの余白
const MAP_VB_W = MAP_PAD_X*2 + (MAP_COLS-1)*MAP_CELL_W;
const MAP_VB_H = MAP_PAD_Y*2 + MAP_TOP_EXTRA + (MAP_ROWS-1)*MAP_CELL_H;
MAP_NODES.forEach((n,i)=>{
  const row = Math.floor(i / MAP_COLS);
  const posInRow = i % MAP_COLS;
  const col = (row % 2 === 0) ? posInRow : (MAP_COLS - 1 - posInRow); // 偶数行→右へ、奇数行→左へ
  n.x = MAP_PAD_X + col*MAP_CELL_W;
  n.y = MAP_PAD_Y + MAP_TOP_EXTRA + row*MAP_CELL_H;
});

function seededRand(seed){ const x = Math.sin(seed*999.7)*10000; return x - Math.floor(x); }

// Catmull-Romスプライン→ベジェ曲線に変換して、なめらかに曲がる道を作る
function smoothPathD(points){
  if(points.length<2) return '';
  let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
  for(let i=0;i<points.length-1;i++){
    const p0 = points[i===0?0:i-1];
    const p1 = points[i];
    const p2 = points[i+1];
    const p3 = points[i+2>=points.length?points.length-1:i+2];
    const c1x = p1.x + (p2.x-p0.x)/6, c1y = p1.y + (p2.y-p0.y)/6;
    const c2x = p2.x - (p3.x-p1.x)/6, c2y = p2.y - (p3.y-p1.y)/6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}

function playerXY(position){
  for(let i=0;i<MAP_NODES.length-1;i++){
    const a=MAP_NODES[i], b=MAP_NODES[i+1];
    if(position>=a.pos && position<=b.pos){
      const frac = b.pos===a.pos ? 0 : (position-a.pos)/(b.pos-a.pos);
      return {x:a.x+(b.x-a.x)*frac, y:a.y+(b.y-a.y)*frac};
    }
  }
  const last = MAP_NODES[MAP_NODES.length-1];
  return {x:last.x, y:last.y};
}

// 静的パーツ（地形・道・装飾・宿場バナー・ゴールパネル）は一度だけ組み立てて使い回す
const MAP_STATION_COLOR = '#28457a'; // 宿場パネルは統一色
function buildMapStaticSVG(){
  let terrain = `<rect x="0" y="0" width="${MAP_VB_W}" height="${MAP_VB_H}" fill="#f1ead8"/>`;
  // 帯（行）の色分けはやめ、道の通り道だけ淡く均一なトーンで敷く
  for(let row=0; row<MAP_ROWS; row++){
    const y = MAP_PAD_Y + MAP_TOP_EXTRA + row*MAP_CELL_H;
    terrain += `<rect x="${(MAP_PAD_X-90).toFixed(1)}" y="${(y-MAP_CELL_H/2+10).toFixed(1)}" width="${(MAP_VB_W-MAP_PAD_X*2+180).toFixed(1)}" height="${(MAP_CELL_H-20).toFixed(1)}" rx="26" fill="#dde6c9" opacity="0.4"/>`;
  }

  // 外周の余白に、木や花などの装飾を散らす
  let deco = '';
  const decoEmoji = ['🌳','🌲','🌸','🌼','☁️','🍃','⛰️','🐦'];
  const decoSpots = [];
  for(let row=0; row<MAP_ROWS; row++){
    decoSpots.push({x:MAP_PAD_X-52, y:MAP_PAD_Y+MAP_TOP_EXTRA+row*MAP_CELL_H});
    decoSpots.push({x:MAP_VB_W-MAP_PAD_X+52, y:MAP_PAD_Y+MAP_TOP_EXTRA+row*MAP_CELL_H});
  }
  for(let col=0; col<MAP_COLS; col++){
    decoSpots.push({x:MAP_PAD_X+col*MAP_CELL_W, y:20});
    decoSpots.push({x:MAP_PAD_X+col*MAP_CELL_W, y:MAP_VB_H-MAP_PAD_Y+58});
  }
  decoSpots.forEach((c,i)=>{
    const lateral = (seededRand(i*9+2)-0.5)*40;
    const vert = (seededRand(i*6+5)-0.5)*40;
    const emoji = decoEmoji[Math.floor(seededRand(i*17+3)*decoEmoji.length)];
    const size = 22 + seededRand(i+1)*14;
    deco += `<text x="${(c.x+lateral).toFixed(1)}" y="${(c.y+vert).toFixed(1)}" font-size="${size.toFixed(0)}" text-anchor="middle" opacity="0.85">${emoji}</text>`;
  });

  const roadD = smoothPathD(MAP_NODES);
  const road = `
    <path d="${roadD}" fill="none" stroke="#e9dcc0" stroke-width="28" stroke-linecap="round"/>
    <path d="${roadD}" fill="none" stroke="#c9b183" stroke-width="22" stroke-linecap="round"/>
    <path d="${roadD}" fill="none" stroke="#fff8ee" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.8"/>
  `;

  // 宿場と宿場の間の細かいマス（近道/後退を含む）も、盤面に見える小さな四角として描く
  let ticks = '';
  WAYPOINTS.forEach(w=>{
    if(w.type==='station') return; // 宿場は別途、大きなパネルで描く
    const {x, y} = playerXY(w.pos);
    if(w.type==='special'){
      const isForward = w.kind==='forward';
      const color = isForward ? 'var(--forward)' : 'var(--back)';
      const bg = isForward ? 'var(--forward-soft)' : 'var(--back-soft)';
      const icon = isForward ? '🐎' : '🌀';
      ticks += `
        <rect x="${(x-13).toFixed(1)}" y="${(y-13).toFixed(1)}" width="26" height="26" rx="6" fill="${bg}" stroke="${color}" stroke-width="2.5"/>
        <text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" font-size="14" text-anchor="middle">${icon}</text>
      `;
    } else {
      ticks += `<rect x="${(x-5).toFixed(1)}" y="${(y-5).toFixed(1)}" width="10" height="10" rx="2" fill="#fff8ee" stroke="#c9b183" stroke-width="1.5"/>`;
    }
  });

  const PW = 94, PH = 94; // パネルの大きさ（New Yearすごろく風の四角パネル）
  let banners = '';
  MAP_NODES.forEach((n,i)=>{
    if(n.isGoal) return; // ゴールは中心パネルとして別途描画
    const isStart = n.type==='start';
    const fill = isStart ? 'var(--indigo-900)' : MAP_STATION_COLOR;
    const bx = n.x, by = n.y;
    banners += `
      <g class="map-node" onclick="showStationInfoModal(${i})" style="cursor:pointer;">
        <rect x="${(bx-PW/2).toFixed(1)}" y="${(by-PH/2).toFixed(1)}" width="${PW}" height="${PH}" rx="16" fill="${fill}" stroke="#fff8ee" stroke-width="4"/>
        <rect x="${(bx-PW/2).toFixed(1)}" y="${(by-PH/2).toFixed(1)}" width="${PW}" height="${PH}" rx="16" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
        <text x="${bx.toFixed(1)}" y="${(by-6).toFixed(1)}" font-size="34" text-anchor="middle">${n.icon}</text>
        <text x="${bx.toFixed(1)}" y="${(by+30).toFixed(1)}" font-size="13" font-weight="800" text-anchor="middle" fill="#fff8ee" font-family="'Zen Kaku Gothic New', sans-serif">${escapeHtml(n.name)}</text>
      </g>
    `;
  });

  // 寄り道の分岐バブル（本筋から真上に、行き・帰りの2本の道で袋小路状につなぐ）
  let branches = '';
  Object.keys(BRANCH_POINTS).forEach(posStr=>{
    const pos = Number(posStr);
    const sq = BRANCH_POINTS[pos];
    const attach = playerXY(pos);
    const bx = attach.x, by = attach.y - 140; // 本筋から真上にオフセット
    const midY = (attach.y + by) / 2;
    const goD = `M ${attach.x.toFixed(1)} ${attach.y.toFixed(1)} Q ${(attach.x-16).toFixed(1)} ${midY.toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`;
    const backD = `M ${bx.toFixed(1)} ${by.toFixed(1)} Q ${(attach.x+16).toFixed(1)} ${midY.toFixed(1)} ${attach.x.toFixed(1)} ${attach.y.toFixed(1)}`;
    branches += `
      <path d="${goD}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-dasharray="4 6"/>
      <path d="${backD}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-dasharray="4 6"/>
      <g class="map-node" onclick="showBranchInfoModal('${sq.key}')" style="cursor:pointer;">
        <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="34" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="4"/>
        <text x="${bx.toFixed(1)}" y="${(by+8).toFixed(1)}" font-size="26" text-anchor="middle">${sq.icon}</text>
      </g>
      <text x="${bx.toFixed(1)}" y="${(by+50).toFixed(1)}" font-size="11" font-weight="700" text-anchor="middle" fill="#8a6a1a" font-family="'Zen Kaku Gothic New', sans-serif">${escapeHtml(sq.name)}</text>
    `;
  });

  // 中心のゴールパネル（日光東照宮のイメージ）
  const goalNode = MAP_NODES[MAP_NODES.length-1];
  const gx = goalNode.x, gy = goalNode.y;
  const GW = 170, GH = 170;
  const goalPanel = `
    <g class="map-node" onclick="showStationInfoModal(${MAP_NODES.length-1})" style="cursor:pointer;">
      <rect x="${(gx-GW/2).toFixed(1)}" y="${(gy-GH/2).toFixed(1)}" width="${GW}" height="${GH}" rx="22" fill="#fff8ee" stroke="var(--vermillion)" stroke-width="6"/>
      <rect x="${(gx-GW/2+8).toFixed(1)}" y="${(gy-GH/2+8).toFixed(1)}" width="${GW-16}" height="${GH-16}" rx="16" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="3 6"/>
      <text x="${gx.toFixed(1)}" y="${(gy-28).toFixed(1)}" font-size="56" text-anchor="middle">⛩️</text>
      <text x="${gx.toFixed(1)}" y="${(gy+22).toFixed(1)}" font-size="19" font-weight="800" text-anchor="middle" fill="var(--indigo-900)" font-family="'Shippori Mincho', serif">日光</text>
      <text x="${gx.toFixed(1)}" y="${(gy+46).toFixed(1)}" font-size="15" font-weight="700" text-anchor="middle" fill="var(--vermillion-dark)" font-family="'Shippori Mincho', serif">東照宮</text>
      <g>
        <ellipse cx="${(gx+130).toFixed(1)}" cy="${(gy-90).toFixed(1)}" rx="52" ry="28" fill="#fff8ee" stroke="var(--vermillion)" stroke-width="2.5"/>
        <text x="${(gx+130).toFixed(1)}" y="${(gy-84).toFixed(1)}" font-size="14" font-weight="800" text-anchor="middle" fill="var(--vermillion-dark)" font-family="'Shippori Mincho', serif">到着〜！</text>
      </g>
    </g>
  `;

  return `<g class="map-terrain">${terrain}</g><g class="map-deco">${deco}</g><g class="map-road">${road}</g><g class="map-ticks">${ticks}</g><g class="map-banners">${banners}</g><g class="map-branches">${branches}</g><g class="map-goal">${goalPanel}</g>`;
}

function showBranchInfoModal(key){
  const sq = SIDEQUEST_DEFS.find(s=>s.key===key);
  if(!sq) return;
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `
    <div class="modal-card">
      <div class="stamp side">${sq.icon}</div>
      <h3>${escapeHtml(sq.name)}</h3>
      <p class="quote">${escapeHtml(sq.trivia)}</p>
      <p class="note">サイコロでちょうどこの分岐点に止まると、本筋を進むか寄り道するか選べます。</p>
      <button class="btn btn-main" id="closeBranchInfoBtn">閉じる</button>
    </div>
  `;
  document.body.appendChild(div);
  document.getElementById('closeBranchInfoBtn').onclick = ()=> div.remove();
}

  const n = MAP_NODES[i];

  div.innerHTML = `

  `;

function buildMapTokensSVG(players){
  const groups = {};
  players.forEach(p=>{
    const key = Math.round(playerXY(p.position).x)+','+Math.round(playerXY(p.position).y);
    (groups[key] = groups[key] || []).push(p);
  });
  let svg = '';
  Object.keys(groups).forEach(key=>{
    const list = groups[key];
    // 自分がいるグループなら自分を先頭に（重なったとき手前に見えるように）
    list.sort((a,b)=> (a.nickname===ME?-1:0) - (b.nickname===ME?-1:0));
    list.forEach((p,idx)=>{
      const {x,y} = playerXY(p.position);
      const jitter = list.length>1 ? (idx - (list.length-1)/2) * 30 : 0;
      const isMe = p.nickname===ME;
      const tx = x+jitter, ty = y;
      if(isMe){
        svg += `
          <g id="myTokenGroup" class="my-token-marker" transform="translate(${tx.toFixed(1)},${ty.toFixed(1)})">
            <circle cx="0" cy="0" r="34" fill="none" stroke="var(--vermillion)" stroke-width="3" class="my-token-pulse"/>
            <circle cx="0" cy="0" r="26" fill="${colorFor(p.nickname)}" stroke="#fff8ee" stroke-width="4"/>
            <text x="0" y="8" font-size="18" font-weight="900" text-anchor="middle" fill="#fff8ee" font-family="'Zen Kaku Gothic New', sans-serif">${escapeHtml(initials(p.nickname))}</text>

}
function initials(name){ return (name||'?').trim().slice(0,2); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function clampMapPan(){
  const minPanX = Math.min(0, MAP_VB_W*(1-MAP_SCALE));
  const minPanY = Math.min(0, MAP_VB_H*(1-MAP_SCALE));
  MAP_PAN_X = Math.min(0, Math.max(minPanX, MAP_PAN_X));
  MAP_PAN_Y = Math.min(0, Math.max(minPanY, MAP_PAN_Y));
}
function applyMapTransform(){
  clampMapPan();
  const g = document.getElementById('mapViewport');
  if(g) g.setAttribute('transform', `translate(${MAP_PAN_X.toFixed(1)},${MAP_PAN_Y.toFixed(1)}) scale(${MAP_SCALE.toFixed(3)})`);
}
function focusMapOnMe(){
  if(!PLAYER) return;
  const {x,y} = playerXY(PLAYER.position);
  MAP_SCALE = 2;
  MAP_PAN_X = MAP_VB_W/2 - x*MAP_SCALE;
  MAP_PAN_Y = MAP_VB_H/2 - y*MAP_SCALE;
  applyMapTransform();
}
function resetMapView(){
  MAP_SCALE = 1; MAP_PAN_X = 0; MAP_PAN_Y = 0;
  applyMapTransform();
}
function setupMapDrag(svgEl){
  if(!svgEl) return;
  let dragging = false, start = {x:0,y:0}, panStart = {x:0,y:0}, moved = 0;
  svgEl.addEventListener('pointerdown', e=>{
    dragging = true; moved = 0; start = {x:e.clientX, y:e.clientY}; panStart = {x:MAP_PAN_X, y:MAP_PAN_Y};
    svgEl.setPointerCapture(e.pointerId);
  });
  svgEl.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const rect = svgEl.getBoundingClientRect();
    const factor = MAP_VB_W / rect.width;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    moved = Math.max(moved, Math.hypot(dx, dy));
    MAP_PAN_X = panStart.x + dx * factor;
    MAP_PAN_Y = panStart.y + dy * factor;
    applyMapTransform();
  });
  const endDrag = ()=>{ dragging = false; };
  svgEl.addEventListener('pointerup', endDrag);
  svgEl.addEventListener('pointerleave', endDrag);
  svgEl.addEventListener('wheel', e=>{
    e.preventDefault();
    MAP_SCALE = Math.min(3, Math.max(1, MAP_SCALE + (e.deltaY>0 ? -0.12 : 0.12)));
    applyMapTransform();
  }, {passive:false});
  // ドラッグ操作の直後は、下のパネルのクリック（宿場詳細ポップアップ）が誤って開かないようにする
  svgEl.addEventListener('click', e=>{
    if(moved > 6){ e.stopPropagation(); e.preventDefault(); }
  }, true);
}

// JSONP方式でApps Scriptと通信（CORSの制約を受けないため確実に動く）
function jsonpCall(params){
  return new Promise((resolve)=>{
    const cbName = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    let done = false;
    const cleanup = ()=>{
      try{ delete window[cbName]; }catch(e){}
      const s = document.getElementById(cbName);
      if(s && s.parentNode) s.parentNode.removeChild(s);
    };
    const timer = setTimeout(()=>{
      if(!done){ done=true; cleanup(); resolve({ok:false, error:'timeout'}); }
    }, 15000);
    window[cbName] = function(data){
      if(done) return;
      done = true; clearTimeout(timer); cleanup();
      resolve(data);
    };
    const qs = Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k]==null?'':params[k])).join('&');
    const script = document.createElement('script');
    script.id = cbName;
    script.src = API_URL + '?' + qs + '&callback=' + cbName;
    script.onerror = function(){
      if(done) return;
      done = true; clearTimeout(timer); cleanup();
      resolve({ok:false, error:'network'});
    };
    document.body.appendChild(script);
  });
}
async function apiCall(action, payload){
  return jsonpCall(Object.assign({action}, payload));
}

function rankPlayers(list){

    if(aG) return -1; if(bG) return 1;
    return b.position - a.position;
  });
}

      <h3>${kind==='main' ? '🎲 本日のサイコロ' : '🎲 ' + escapeHtml(reasonLabel)}</h3>
      <p class="note" style="margin-bottom:14px;">${count>1 ? count+'個のサイコロを同時に振ります。' : 'サイコロを振ります。'}</p>
      <div class="dice-3d-row">${Array.from({length:count}).map((_,i)=>dieCubeHTML(i)).join('')}</div>
      <div class="dice-result" id="diceModalResult"></div>
      <button class="btn btn-main" id="diceModalBtn">サイコロを押す</button>
    </div>
  `;
  document.body.appendChild(div);

  const btn = document.getElementById('diceModalBtn');
  btn.onclick = async ()=>{
    btn.disabled = true;
    const values = [];
    for(let i=0;i<count;i++){
      const v = 1 + Math.floor(Math.random()*6);
      values.push(v);
      const cube = document.getElementById('dieCube'+i);
      const rot = DICE_ROTATION[v];
      const extraX = 360*(2+Math.floor(Math.random()*2));
      const extraY = 360*(2+Math.floor(Math.random()*2));
      cube.style.transform = `rotateX(${rot.rx+extraX}deg) rotateY(${rot.ry+extraY}deg)`;
    }
    await new Promise(res=>setTimeout(res, 1050));

    if(kind==='main'){ PLAYER.lastRollDate = todayStr(); }
    const reasonText = kind==='main' ? '本日のサイコロ' : reasonLabel;
    const arrivals = [];
    let total = 0;
    let stoppedAtBranch = false;
    for(const v of values){
      total += v;
      const text = kind==='main'
        ? `本日のサイコロで${v}が出て、${v}マス進んだ`
        : `（${reasonText}）ボーナスサイコロで${v}が出て、${v}マス進んだ`;
      const arrival = movePlayer(v, text);
      if(arrival && arrival.type==='branch'){
        div.style.display = 'none'; // 選択ダイアログの間、サイコロのポップアップは一旦隠す
        const choice = await showBranchChoiceModal(arrival);
        div.style.display = '';
        if(choice === 'side'){
          PLAYER.history.push({date: new Date().toISOString().slice(0,16).replace('T',' '), kind:'branch', text:`${arrival.name}へ寄り道（${arrival.activity}）`});
          arrivals.push(arrival);
          stoppedAtBranch = true;
          break; // 寄り道を選んだので、残りの出目は打ち切り
        }
        // 「本筋を進む」を選んだ場合は何もせず次の出目へ
      } else if(arrival){
        arrivals.push(arrival);
      }
      if(PLAYER.position>=GOAL_POS) break;
    }
    // ポップアップはフェードしながら閉じて、盤面上でコマが動く様子を見せる（保存は裏で並行して進める）
    div.classList.add('fade-out');
    await new Promise(res=>setTimeout(res, 280));
    div.remove();
    document.querySelector('.map-wrap')?.scrollIntoView({behavior:'smooth', block:'center'});
    const savePromise = apiSave(PLAYER);
    await animateMyTokenTo(PLAYER.position);
    await savePromise;

    await refreshAll();
    renderGame();
    showArrivalQueue(arrivals);
  };
}

// 盤面上の自分のコマを、現在描画されているSVGの上でなめらかに移動させる
function animateMyTokenTo(newPos){
  return new Promise(resolve=>{
    const g = document.getElementById('myTokenGroup');
    if(!g){ resolve(); return; }
    const {x, y} = playerXY(newPos);
    g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
    setTimeout(resolve, 950); // CSSのtransition時間（0.9s）に合わせて待つ
  });
}

// 分岐点で「本筋を進む」か「寄り道する」かを選ばせるモーダル。選択結果をPromiseで返す。
function showBranchChoiceModal(branch){
  return new Promise(resolve=>{
    const div = document.createElement('div');
    div.className = 'modal-backdrop';
    div.innerHTML = `
      <div class="modal-card">
        <div class="stamp side">${branch.icon}</div>
        <h3>${escapeHtml(branch.name)}への分かれ道</h3>
        <p class="quote">${escapeHtml(branch.trivia)}</p>
        <p class="note">寄り道すると、今日はここで打ち止めになります（残りの出目は無効）。</p>
        <div style="display:flex; gap:10px; margin-top:6px;">
          <button class="btn btn-ghost" id="branchMainBtn" style="flex:1;">本筋を進む</button>
          <button class="btn btn-main" id="branchSideBtn" style="flex:1;">寄り道する</button>
        </div>
      </div>
    `;
    document.body.appendChild(div);
    document.getElementById('branchMainBtn').onclick = ()=>{ div.remove(); resolve('main'); };
    document.getElementById('branchSideBtn').onclick = ()=>{ div.remove(); resolve('side'); };
  });
}

async function rollMain(){
  const t = todayStr();
  if(PLAYER.lastRollDate === t || PLAYER.position>=GOAL_POS) return;
  openDiceModal(1, 'main', '本日のサイコロ');
}

/* ============ ボーナス申告（選択→エピソード入力→掲示板投稿→サイコロ） ============ */
function bonusOptions(kind){
  if(kind==='client') return CLIENT_BONUS.map(b=>({label:b.label, amount:b.amount}));
  return HOKKORI.map(h=>({label:h, amount:1}));
}

function showChoiceModal(kind){
  const opts = bonusOptions(kind);
  const title = kind==='client' ? '🤝 顧問先獲得ボーナス' : '☕ ほっこりボーナス';
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `
    <div class="modal-card choice-modal-card">
      <h3>${title}</h3>
      <p class="note" style="margin-bottom:14px;">該当するものを選んでください。</p>
      <div class="choice-list">
        ${opts.map((o,i)=>`
          <button class="choice-item" data-idx="${i}">
            <span class="choice-label">${escapeHtml(o.label)}</span>
            <span class="choice-amount">サイコロ${o.amount}回</span>
          </button>
        `).join('')}
      </div>
      <button class="btn btn-ghost" id="choiceCancelBtn" style="margin-top:14px;">キャンセル</button>
    </div>
  `;
  document.body.appendChild(div);
  div.querySelectorAll('.choice-item').forEach(btn=>{
    btn.onclick = ()=>{ div.remove(); showEpisodeModal(kind, parseInt(btn.dataset.idx)); };
  });
  document.getElementById('choiceCancelBtn').onclick = ()=> div.remove();
}

function showEpisodeModal(kind, idx){
  const opt = bonusOptions(kind)[idx];
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `
    <div class="modal-card">
      <h3>${escapeHtml(opt.label)}</h3>
      <p class="note" style="margin-bottom:10px;">どんなことがあったの？（掲示板にニックネームと一緒に投稿されます）</p>
      <textarea id="episodeInput" class="episode-textarea" rows="4" placeholder="例）顧問先の担当者さんにお礼を言われて嬉しかった"></textarea>
      <div class="err" id="episodeErr" style="min-height:1.2em;margin:6px 0;"></div>
      <button class="btn btn-main" id="episodeSubmitBtn" style="width:100%;">投稿してサイコロへ進む</button>
    </div>
  `;
  document.body.appendChild(div);
  document.getElementById('episodeSubmitBtn').onclick = async ()=>{
    const text = document.getElementById('episodeInput').value.trim();
    if(!text){ document.getElementById('episodeErr').textContent = '内容を入力してください。'; return; }
    const btn = document.getElementById('episodeSubmitBtn');
    btn.disabled = true; btn.textContent = '投稿中…';
    await apiPostBoard(kind, text);
    await refreshBoard();
    div.remove();
    openDiceModal(opt.amount, 'bonus', opt.label);
  };
}

function movePlayer(roll, text){
  const prevPos = PLAYER.position;
  let newPos = Math.min(GOAL_POS, prevPos + roll);
  PLAYER.position = newPos;
  PLAYER.history.push({date: new Date().toISOString().slice(0,16).replace('T',' '), kind:'move', text});

  if(newPos <= prevPos) return null;

  if(newPos >= GOAL_POS && !PLAYER.arrivedAt){
    PLAYER.arrivedAt = new Date().toISOString();
    return {type:'goal', name:'鉢石宿（日光東照宮）'};
  }

  const branch = BRANCH_POINTS[newPos];
  if(branch){
    return {type:'branch', key:branch.key, name:branch.name, icon:branch.icon, trivia:branch.trivia, activity:branch.activity, illustration:branch.illustration};
  }

  const w = wpAt(newPos);
  if(!w) return null;

  if(w.type==='special'){
    const target = specialTarget(w);
    const fromLabel = stationLabel(newPos>0?newPos:0);
    PLAYER.position = target;
    PLAYER.history.push({date: new Date().toISOString().slice(0,16).replace('T',' '), kind:'special', text:(w.kind==='forward'?'近道マスで':'後退マスで')+stationLabel(target)+'まで移動'});
    if(target >= GOAL_POS && !PLAYER.arrivedAt){ PLAYER.arrivedAt = new Date().toISOString(); return {type:'goal', name:'鉢石宿（日光東照宮）'}; }
    return {type:'special', kind:w.kind, targetName: stationLabel(target)};
  }

  if(w.type==='station') return w;
  return null;
}

function showArrivalQueue(list){
  if(!list.length) return;
  let i=0;
  const showNext = ()=>{ if(i>=list.length) return; const w = list[i]; i++; showArrivalModal(w, showNext); };
  showNext();
}

function showArrivalModal(w, onClose){
  const isGoal = w.type==='goal' || w.isGoal;
  const isBranch = w.type==='branch';
  const isSpecial = w.type==='special';
  let quote, title, stampText, stampCls='', illustrationHTML='';
  if(isGoal){
    title = '🎉 ゴール！日光東照宮に到着';
    quote = '「日光東照宮、到着おめでとうございます。ここまでの道のり、お疲れさまでした。」<br><span style="font-size:0.7rem;color:#a99a72;">― 先輩社労士（仮）</span>';
    stampText = '日光<br>到着';
  } else if(isSpecial){
    if(w.kind==='forward'){
      title = '🐎 近道！一気に前進';
      quote = `馬が疾走！次の宿場「${w.targetName}」まで一気に進みました。`;
      stampText = '近道';
      stampCls = 'forward';
    } else {
      const n = w.kind==='back1' ? 'ひとつ' : 'ふたつ';
      title = '😮 足止め…後退';
      quote = `事情があって、${n}前の宿場「${w.targetName}」まで戻ることになりました。`;
      stampText = '後退';
      stampCls = 'back';
    }
  } else if(isBranch){
    title = w.icon + ' ' + w.name + 'へ寄り道';
    quote = `${w.activity}をしました。`;
    stampText = '寄り道';
    stampCls = 'side';
    illustrationHTML = `<div class="branch-illustration">${w.illustration}</div>`;
  } else {
    title = w.name + ' に到着';
    const idx = (w.stationOrder!=null ? w.stationOrder : 0) % DUMMY_QUOTES.length;
    quote = DUMMY_QUOTES[idx] + '<br><span style="font-size:0.7rem;color:#a99a72;">― 先輩社労士（仮）</span>';
    stampText = '通過';
  }
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `
    <div class="modal-card">
      <div class="stamp ${stampCls}">${stampText}</div>
      ${illustrationHTML}
      <h3>${title}</h3>
      <p class="quote">${quote}</p>
      <p class="note">${isBranch ? '※明日はこの場所から本筋を進みます。' : isSpecial ? '※このマスの効果で移動しました。' : '※このメッセージは仮の文言です。後日差し替え予定です。'}</p>
      <button class="btn btn-main" id="closeModalBtn">閉じる</button>
    </div>
  `;
  document.body.appendChild(div);
  document.getElementById('closeModalBtn').onclick = ()=>{ div.remove(); if(onClose) onClose(); };
}
